[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:openclaw]
command=/usr/local/bin/openclaw gateway --allow-unconfigured --bind lan
autostart=true
autorestart=true
priority=10
startsecs=5
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Copy this file into your own deployment and add optional helper processes below.
; Keep personal services out of the base image by defining them only in your mounted config.
;
; Example:
; [program:task-watcher]
; command=/home/openclaw/bin/task-watcher
; directory=/home/openclaw
; autostart=true
; autorestart=true
; priority=20
; stdout_logfile=/dev/fd/1
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/fd/2
; stderr_logfile_maxbytes=0
