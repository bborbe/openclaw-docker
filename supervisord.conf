[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:openclaw]
command=/usr/local/bin/openclaw gateway --allow-unconfigured --bind lan
autostart=true
autorestart=true
priority=10
startsecs=5
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[include]
files=/home/openclaw/.config/supervisor/conf.d/*.conf
